# ============================================================================
#  共享配置 —— 提交到仓库，因此这里不放任何真实凭据
# ----------------------------------------------------------------------------
#  本机专用的连接信息（数据库 / Redis / RabbitMQ 主机与密码）放在
#  application-local.properties，该文件已在 .gitignore 中忽略。
#  需要照模板自己建一份：application-local.properties.example
# ============================================================================

# 默认启用 local profile，真实连接信息由 application-local.properties 提供
spring.profiles.active=local

#thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.thymeleaf.content-type=text/html
spring.thymeleaf.enabled=true
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML5

# mybatis
mybatis.type-aliases-package=com.godenglow.seckill.domain
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.default-fetch-size=100
mybatis.configuration.default-statement-timeout=3000
# 说明：本项目所有 Mapper 都是注解式（@Select/@Insert/@Update），dao 包下没有任何 XML
# 映射文件，因此下面这项配置匹配不到任何文件，属于历史遗留。保留为注释以免误导。
#mybatis.mapperLocations=classpath:com/godenglow/seckill/dao/*.xml

# ---------------------------------------------------------------------------
# Druid 连接池
# ---------------------------------------------------------------------------
# 这里只放与连接无关的调优项；url / username / password 在 application-local.properties。
#
# 关于这些参数为什么以前"设了不生效"：Spring Boot 1.5 的 DataSourceProperties 只认
# url / driver-class-name / username / password 等少数字段，spring.datasource.maxActive
# 这类 Druid 专有参数不会被绑定。DataSourceConfig 里改为直接把 DruidDataSource 交给
# @ConfigurationProperties(prefix="spring.datasource") 绑定，这些参数才真正生效。
#
# 数值说明：原配置是 maxActive=1000 / initialSize=100 / minIdle=500。这在单机开发环境
# 并不现实——MySQL 默认 max_connections=151，启动即申请 100 条连接会直接顶到上限。
# 下面改为适合本地演示的取值。
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.max-active=20
spring.datasource.initial-size=5
spring.datasource.min-idle=5
spring.datasource.max-wait=60000
spring.datasource.time-between-eviction-runs-millis=60000
spring.datasource.min-evictable-idle-time-millis=300000
spring.datasource.validation-query=select 'x'
spring.datasource.test-while-idle=true
spring.datasource.test-on-borrow=false
spring.datasource.test-on-return=false

#static
spring.resources.add-mappings=true
spring.resources.cache-period=3600
spring.resources.chain.cache=true
spring.resources.chain.enabled=true
spring.resources.chain.gzipped=true
spring.resources.chain.html-application-cache=true
spring.resources.static-locations=classpath:/static/

# ---------------------------------------------------------------------------
# RabbitMQ 消费者调优（连接信息在 application-local.properties）
# ---------------------------------------------------------------------------
#消费者数量
spring.rabbitmq.listener.simple.concurrency=10
spring.rabbitmq.listener.simple.max-concurrency=10
#消费者每次从队列获取的消息数量
spring.rabbitmq.listener.simple.prefetch=1
#消费者自动启动
spring.rabbitmq.listener.simple.auto-startup=true
#消费失败，自动重新入队
spring.rabbitmq.listener.simple.default-requeue-rejected=true
#启用发送重试
spring.rabbitmq.template.retry.enabled=true
spring.rabbitmq.template.retry.initial-interval=1000
spring.rabbitmq.template.retry.max-attempts=3
spring.rabbitmq.template.retry.max-interval=10000
spring.rabbitmq.template.retry.multiplier=1.0

# ---------------------------------------------------------------------------
# AI 助手（可选模块）
# ---------------------------------------------------------------------------
# 走 DeepSeek 的 OpenAI 兼容接口。这里只放非敏感配置；api-key 属于凭据，
# 放在 application-local.properties（已被 .gitignore 忽略）。
# 未配置 api-key 时 /ai/chat 会返回明确提示，不影响其他功能。
ai.enabled=false
ai.deepseek.base-url=https://api.deepseek.com
ai.deepseek.model=deepseek-chat
ai.deepseek.temperature=0.7
